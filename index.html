function serviceDates(month,day){const start=new Date(Date.UTC(2013,month-1,day));const discharge=new Date(Date.UTC(2013,month-1+21,day-1));return {start:start.toISOString().slice(0,10),discharge:discharge.toISOString().slice(0,10),months:21}}
function dateAt(g,offset=g.elapsed){const d=new Date(g.dates.start+'T00:00:00Z');d.setUTCDate(d.getUTCDate()+offset);return d.toISOString().slice(0,10)}
function dischargeDays(g){return Math.round((Date.parse(g.dates.discharge)-Date.parse(dateAt(g)))/86400000)}
function initGrowth(g){const e=g.profile.experiences;g.elapsed=0;g.dates=serviceDates(g.month,g.day);g.stats={fitness:35+(e.includes('운동')?15:0),spirit:30,basic:25,social:35+(e.includes('단체생활')?10:0),aptitude:30+e.length*10};g.aptitudeInitial=g.stats.aptitude;g.fatigue=10;g.logs=[];g.dayPlan='rest';g.dayAction=-1;g.speed=1;g.timelineReady=false;g.initialTraits=structuredClone(g.traits);}
function gain(g,key,n){const before=g.stats[key];g.stats[key]=Math.max(0,Math.min(100,before+n));return g.stats[key]-before}
function daily(g){if(g.dayAction===g.elapsed)return;g.dayAction=g.elapsed;const day=g.elapsed+1;let text;const effects=[];if(g.dayPlan==='train'){effects.push(['fitness',gain(g,'fitness',g.fatigue>70?1:2)]);g.fatigue=Math.min(100,g.fatigue+7);text='개인정비 시간에 가볍게 운동했다.'}else if(g.dayPlan==='study'){effects.push(['spirit',gain(g,'spirit',1)],['basic',gain(g,'basic',1)]);g.fatigue=Math.min(100,g.fatigue+3);text='오늘 배운 내용을 다시 읽고 준비물을 확인했다.'}else if(g.dayPlan==='talk'){effects.push(['social',gain(g,'social',1)]);g.fatigue=Math.max(0,g.fatigue-3);text='동기와 오늘 있었던 일을 이야기했다.'}else{g.fatigue=Math.max(0,g.fatigue-12);text='쉬면서 몸 상태를 챙겼다.'}if(day%7===1){g.logs.push({day,date:dateAt(g),kind:'schedule',text:'이번 주 일정이 전달되었다.'})}g.logs.push({day,date:dateAt(g),kind:'daily',text,effects});}
function dayForward(g){if(g.phase!=='timeline')return;daily(g);const day=g.elapsed+1;if(g.fatigue>=75&&g.elapsed-(g.lastMedical??-10)>=7&&!g.logs.some(l=>l.day===day&&l.kind==='medical'))return 'medical';if(TRAINING_DAYS.includes(day)&&!g.logs.some(l=>l.day===day&&l.kind==='training'))return 'training';if(EVENT_DAYS.includes(day)&&!g.logs.some(l=>l.day===day&&l.kind==='event'))return 'event';if(day>=35){g.phase='ending';g.week=5;return 'ending'}g.elapsed++;g.week=Math.min(5,Math.floor(g.elapsed/7)+1);g.slot=EVENT_DAYS.filter(d=>Math.ceil(d/7)===g.week&&d<g.elapsed+1).length;return 'day'}

function createGame(profile,seed=String(Date.now()),seen=[]){const r=rng(seed);const season=Math.floor(r()*4);const months=[3,6,9,12];const day=4+Math.floor(r()*17);const names=shuffle(NAMES.filter(n=>n!==profile.name),r);const types=shuffle(PROFILES,r);const squad=types.map((p,i)=>({id:'m'+i,name:names[i],age:19+Math.floor(r()*10),profile:p.id,friend:0,trust:0,look:Math.floor(r()*10000),sideTrait:PROFILES[Math.floor(r()*9)].id}));const game={version:VERSION,seed,profile,season,month:months[season],day,route:ROUTES[Math.floor(r()*3)],squad,focus:'m0',approach:'m1',instructors:[0,0],traits:Object.fromEntries(Object.keys(TRAITS).map(k=>[k,0])),week:1,slot:0,phase:'notice',beat:0,current:null,eventPeer:null,history:[],flags:{},seen,plan:[],mini:null,mood:0,role:'분대원',settings:{large:false,sound:false},createdAt:Date.now(),evidence:[]};for(const exp of profile.experiences){const tags={운동:'endurance',운전:'observation',정비:'technical',컴퓨터:'technical',요리:'order',음악:'communication',외국어:'communication',의료:'care',단체생활:'team'};if(tags[exp])game.traits[tags[exp]]+=2}initGrowth(game);return game}
function pickFocus(g,id){g.focus=id;g.squad.find(m=>m.id===id).friend+=2;g.approach=g.squad.find(m=>m.id!==id&&['joker','kind','clumsy'].includes(m.profile))?.id||g.squad.find(m=>m.id!==id).id;g.phase='timeline'}
function selectEvent(g){const r=rng(g.seed+':'+g.week+':'+g.slot);const done=g.history.map(h=>h.id);let pool=EVENTS.filter(e=>e.week===g.week&&!done.includes(e.id)&&(!e.requires||done.includes(e.requires)));if(g.slot===1){const follow=pool.filter(e=>e.requires);if(follow.length&&r()<.8)pool=follow} else pool=pool.filter(e=>!e.requires);const unseen=pool.filter(e=>!g.seen.includes(e.id));if(unseen.length)pool=unseen;const event=pool[Math.floor(r()*pool.length)];if(!event)throw Error('No event for week '+g.week);g.current=event.id;g.beat=0;g.mini=null;g.phase='event';g.eventPeer=event.requires?g.history.find(h=>h.id===event.requires).peer:(g.slot===0?g.focus:g.approach);return event}
function eventOf(g){return EVENTS.find(e=>e.id===g.current)}
function peerOf(g){return g.squad.find(m=>m.id===g.eventPeer)||g.squad[0]}
function textFor(g,t){const peer=peerOf(g),other=g.squad.find(m=>m.id!==peer.id&&m.id!==g.focus)||g.squad[2];const seasonTasks=['봄바람에 정리한 종이와 작은 물건들이 다시 흩어졌다.','계속된 비에 빨래가 마르지 않는다. 건조 공간을 다시 나눠야 한다.','쓸어 둔 자리 위로 낙엽이 다시 떨어진다.','밤새 쌓인 눈 때문에 아침부터 제설 작업이 시작됐다.'];return String(t).replaceAll('{peer}',peer.name).replaceAll('{other}',other.name).replaceAll('{player}',g.profile.name).replaceAll('{seasonTask}',seasonTasks[g.season])}
function applyChoice(g,index){const e=eventOf(g);if(!e||g.phase!=='event'||g.history.some(h=>h.id===e.id))throw Error('Invalid event transition');const c=e.choices[index];if(!c)throw Error('Invalid choice');const peer=peerOf(g),p=PROFILES.find(p=>p.id===peer.profile);const affinity=c.tags.some(t=>p.likes.includes(t))?1:0;const closeness=peer.friend;let relation=c.relation+affinity+(g.stats?.social>=55&&c.relation>0?1:0);if(c.flag==='nickname'&&closeness<3)relation=-2;peer.friend=Math.max(-5,Math.min(15,peer.friend+relation));peer.trust=Math.max(-5,Math.min(15,peer.trust+(c.tags.includes('order')||c.tags.includes('team')?2:c.relation<0?-1:1)));c.tags.forEach(t=>g.traits[t]=(g.traits[t]||0)+1);INSTRUCTORS.forEach((a,i)=>{g.instructors[i]+=c.relation<0?-1:c.tags.some(t=>a.likes.includes(t))?1:0});if(c.flag==='leader')g.role='분대장 훈련병';if(e.id==='leader'&&c.flag!=='leader')g.flags.otherLeader=g.squad.find(m=>m.id!==g.focus).id;g.flags[e.id]=c.flag||String(index);const result=textFor(g,c.result);const reaction=relation>1?p.line:relation<0?'지금은 뭐라고 대답해야 할지 모르겠어.':'응. 일단 오늘 일부터 끝내자.';const entry={id:e.id,week:g.week,title:e.title,choice:c.text,tags:c.tags,peer:peer.id,peerName:peer.name,result,reaction,flag:c.flag};g.history.push(entry);g.evidence.push(entry);g.seen=[...new Set([...g.seen,e.id])];g.phase='result';g.beat=0;if(g.stats){entry.effects=(STORY_EFFECTS[e.id]?.[index]||[]).map(([key,n])=>[key,gain(g,key,n)]).filter(x=>x[1]!==0);entry.growth=entry.effects[0]||['basic',0];entry.day=g.elapsed+1;g.logs.push({day:g.elapsed+1,date:dateAt(g),kind:'event',text:e.title+' — '+c.text,effects:entry.effects})}return entry}
function advance(g){if(g.phase!=='result')return;g.phase='timeline';g.current=null;g.beat=0;g.mini=null}
function affinityLabel(m){return m.friend>=7?'편하게 기대는 사이':m.friend>=3?'조금씩 가까워지는 중':m.friend<0?'아직 어색한 사이':'같은 생활관의 동기'}
function mbti(answers){return ['EI','SN','TF','JP'].map((s,i)=>answers[i*2]+answers[i*2+1]>=1?s[1]:s[0]).join('')}
function specialtyResult(g,catalog){const r=rng(g.seed+':specialty');const candidates=catalog.filter(x=>x.eligible!==false&&DEMAND_WEIGHTS[x.code]).map(x=>{const matches=(x.requirements||[]).filter(e=>g.profile.experiences.includes(e)).length;const affinity=1+Math.min(1,matches*.5);return {...x,weight:DEMAND_WEIGHTS[x.code]*affinity,tie:r()}});if(!candidates.length)throw Error('No allocation candidates');let draw=r()*candidates.reduce((sum,x)=>sum+x.weight,0);let selected=candidates.at(-1);for(const item of candidates){draw-=item.weight;if(draw<0){selected=item;break}}return{selected,evidence:[],alternatives:candidates.filter(x=>x.code!==selected.code).sort((a,b)=>b.weight-a.weight).slice(0,2),note:ALLOCATION_NOTE}}

function save(){if(!g)return;try{localStorage.setItem(KEY,JSON.stringify(g));localStorage.setItem(SEEN,JSON.stringify(g.seen));saved=g}catch{toast('브라우저 저장 공간이 부족합니다. 이번 화면을 닫지 말아 주세요.')}}
function toast(t){$('#toast').textContent=t;$('#toast').classList.add('show');setTimeout(()=>$('#toast').classList.remove('show'),3200)}
function btn(text,action,kind='primary'){return `<button class="btn ${kind}" data-action="${action}">${text}</button>`}
function scene(type='gate',label='2013 · 어느 입영일',cls=''){return `<div class="scene ${cls}"><canvas data-scene="${type}" aria-label="${esc(label)}의 도트 풍경"></canvas><div class="scene-label">◈ &nbsp; ${esc(label)}</div><span class="scene-bottom">YOUR FIVE WEEKS · EPISODE 01</span></div>`}
function header(){return `<header class="topbar"><button class="brand" data-action="home"><span class="brand-icon">▥</span>입대할게요</button><nav class="topnav"><button class="plain" data-action="guide">플레이 안내</button><button class="plain" data-action="records">나의 기록</button><span class="badge">첫 번째 기수 · v${VERSION}</span><button class="plain" data-action="settings" aria-label="설정">⚙</button></nav></header>`}
function footer(){return `<footer class="foot"><span>입대할게요 © 2026 · 선택으로 만드는 나의 군 생활</span><span>가상 인물과 사건으로 각색한 이야기 &nbsp; <button class="plain" data-action="sources">자료 안내</button></span></footer>`}
function renderLegacy(){const body=screen==='home'?home():screen==='setup'?setup():screen==='quiz'?quiz():game();$('#app').innerHTML=`<div class="wrap ${g?.settings.large?'large-text':''}">${header()}${body}${footer()}</div>`;document.querySelectorAll('canvas').forEach(c=>drawScene(c,c.dataset.scene,g?.season??2,g?.day??5));if(screen==='setup')bindForm();window.scrollTo({top:0,behavior:'instant'})}
function homeLegacy(){return `<main><div class="hero"><section class="hero-main"><div class="eyebrow">A CHOICE-DRIVEN MILITARY STORY</div><h1>입대할게요</h1><p class="hero-sub">에이스냐 폐급이냐, 그것이 문제로다.</p><p class="muted">입영통지서 한 장. 낯선 동기 아홉 명. 그리고 다섯 주.<br>사소한 선택이 모여, 당신만의 군 생활이 됩니다.</p>${scene('gate','2013년 · 당신의 이야기가 시작되는 곳')}<div class="hero-actions">${btn('입영통지서 받기 <span class="arrow">↗</span>','new')}${saved?btn('이어 하기 →','continue','secondary'):btn('어떤 게임인가요?','guide','secondary')}</div><div class="meta-row"><span>◷ &nbsp; 한 회차 15–20분 목표</span><span>♧ &nbsp; 매번 달라지는 동기와 사건</span><span>▣ &nbsp; 자동 저장</span></div></section><aside class="dossier"><div class="dossier-label">PERSONNEL FILE / 001</div><h2>당신의 입영 기록</h2><p class="tiny">아직 쓰이지 않은 이야기</p><div class="stamp">입영 예정</div><hr><div class="record-row"><span>입영 대상자</span><strong>${esc(saved?.profile.name||'당신')}</strong></div><div class="record-row"><span>입영 시기</span><strong>봄 · 여름 · 가을 · 겨울</strong></div><div class="record-row"><span>교육 기간</span><strong>5주</strong></div><div class="record-row"><span>함께할 사람</span><strong>동기 9명 · 조교 2명</strong></div><div class="record-row"><span>나의 주특기</span><strong>아직 모릅니다</strong></div><hr><p class="notice-note">누군가에게는 든든한 동기,<br>누군가에게는 잊지 못할 사고뭉치.<br><br>당신은 어떤 훈련병으로<br>기억될까요?</p><div class="live" style="margin-top:25px"><span class="dot"></span>경험담을 모아 자라나는 게임</div></aside></div><div class="weeks">${WEEKS.map((w,i)=>`<div class="week-item"><span class="week-num">WEEK 0${i+1}</span><strong>${w.short}</strong><small>${['이름부터 다시 시작','조금 알 것 같은데','이제 좀 친해졌나','혼자서는 어렵다','우리, 또 만나자'][i]}</small></div>`).join('')}</div></main>`}
function setup(){const edus=['고등학교 졸업','전문대 재학','대학교 재학','대학교 졸업','대학원 재학'];return `<main class="content"><div class="sectionhead"><div><div class="eyebrow">BEFORE ENLISTMENT</div><h2>입대 전, 나는 어떤 사람?</h2><p class="muted">실제 정보여도, 완전히 다른 인물이어도 괜찮습니다.</p></div><button class="chip" data-action="random-all">⚄ 모두 무작위</button></div><div class="panel"><div class="form-grid"><div><label for="name">이름</label><div class="field-row"><input id="name" maxlength="12" value="${esc(draft.name)}" autocomplete="off"><button class="dice" data-action="random-name" aria-label="이름 무작위">⚄</button></div></div><div><label for="age">입대 나이 · 만 19–28세</label><div class="field-row"><input id="age" type="number" min="19" max="28" value="${draft.age}"><button class="dice" data-action="random-age" aria-label="나이 무작위">⚄</button></div></div><div><label for="education">학력</label><div class="field-row"><select id="education">${edus.filter((x,i)=>draft.age>=23||i<3).map(x=>`<option ${x===draft.education?'selected':''}>${x}</option>`).join('')}</select><button class="dice" data-action="random-education" aria-label="학력 무작위">⚄</button></div></div><div><label>나의 성향 · 게임용 간이 분류</label><div class="field-row"><input value="${draft.mbti}" readonly aria-label="현재 MBTI"><button class="dice" data-action="random-mbti" aria-label="성향 무작위">⚄</button><button class="chip" data-action="quiz">설문하기</button></div></div><div class="full"><label>해본 일 · 최대 3개 <button class="plain" data-action="random-exp">⚄ 무작위</button></label><div class="chips">${EXPERIENCES.map(x=>`<button class="chip ${draft.experiences.includes(x)?'active':''}" data-exp="${x}" aria-pressed="${draft.experiences.includes(x)}">${x}</button>`).join('')}</div><p class="tiny">경험은 시작점입니다. 훈련소에서의 선택이 나머지를 채웁니다.</p></div></div><div class="form-bottom"><span class="tiny">나이와 성향은 대화에 반영됩니다.<br>게임용 설정이며 실제 입영·성격검사 안내가 아닙니다.</span>${btn('이 인물로 입대하기 →','start')}</div></div></main>`}
function bindForm(){['name','age','education'].forEach(k=>$('#'+k).addEventListener('change',e=>{draft[k]=k==='age'?Number(e.target.value):e.target.value;if(k==='age'){draft.age=Math.max(19,Math.min(28,draft.age||21));if(draft.age<23&&['대학교 졸업','대학원 재학'].includes(draft.education))draft.education='대학교 재학';render()}}))}
function quiz(){return `<main class="content"><div class="sectionhead"><div><div class="eyebrow">A SMALL INTRODUCTION</div><h2>조금만 더 알아볼까요?</h2><p class="muted">정답은 없습니다. 지금의 나와 가까운 쪽을 고르세요.</p></div></div><div class="panel">${QUIZ.map((q,i)=>`<div class="quiz"><p>${i+1}. ${q[0]}</p><div class="chips">${[0,1].map(j=>`<button class="chip ${answers[i]===j?'active':''}" data-q="${i}" data-answer="${j}">${q[j+1]}</button>`).join('')}</div></div>`).join('')}<div class="form-bottom"><span class="tiny">정식 MBTI 검사가 아닌 게임용 간이 설문입니다.</span><button class="btn primary" data-action="quiz-done" ${answers.some(x=>x===null)?'disabled':''}>성향 확인 →</button></div></div></main>`}
function gameLegacy(){if(!g)return home();if(g.phase==='notice')return notice();if(g.phase==='arrival')return arrival();if(g.phase==='focus')return focus();if(g.phase==='ending')return ending();return `<main class="game-layout"><section class="game-main"><div class="game-head"><span class="eyebrow">WEEK 0${g.week} / ${g.phase==='schedule'?'주간 일정':`${g.slot+1}번째 이야기`}</span><div class="progress">${WEEKS.map((w,i)=>`<span class="${i<g.week?'on':''}"></span>`).join('')}</div></div>${g.phase==='schedule'?schedule():eventView()}</section>${sidebar()}</main>`}
function noticeLegacy(){return `<main class="content"><div class="eyebrow">PROLOGUE · 입영통지서가 도착했다</div><div class="letter"><div class="dossier-label">이야기 속 문서 · 2013</div><h2>현역병 입영통지서</h2><div class="record-row"><span>성명</span><strong>${esc(g.profile.name)}</strong></div><div class="record-row"><span>입영일자</span><strong>2013년 ${g.month}월 ${g.day}일</strong></div><div class="record-row"><span>입영장소</span><strong>${g.route.name}</strong></div><div class="record-row"><span>소재지</span><strong>${g.route.place}</strong></div><p class="quote">${['창밖으로 봄바람이 들어온다.','선풍기 소리가 유난히 크게 들린다.','창밖에서 마른 잎이 굴러간다.','창문에 차가운 김이 서린다.'][g.season]}<br>봉투에 적힌 내 이름이 오늘은 조금 낯설다.</p><div class="stamp">입영 예정</div></div><div class="choices">${['가족에게 먼저 말한다','친구에게 연락한다','혼자 준비물을 적는다'].map((x,i)=>`<button class="choice" data-prologue="${i}"><span class="key">${i+1}</span>${x}</button>`).join('')}</div><p class="tiny" style="text-align:center">실제 통지서를 재현한 공식 문서가 아닌 게임 속 연출입니다.</p></main>`}
function arrivalLegacy(){return `<main class="content">${scene('gate',`${g.route.name} · ${['봄','여름','가을','겨울'][g.season]} 입영`)}<div class="dialogue"><div class="speaker">${esc(g.profile.name)} · 입영 첫날</div><h2>진짜, 왔다.</h2><p>${esc(g.prologueText)}\n\n${g.route.id==='nonsan'?'입영 안내를 따라 교육중대로 이동했다.':'보충대에서 입영 절차를 마친 뒤, 교육부대로 향하는 버스에 올랐다.'} 창밖 풍경보다 옆자리의 짧은 머리가 더 낯설다.\n\n${g.profile.age>=25?'동기들이 나이를 듣고 잠깐 놀란다. 나이가 조금 더 많아도, 오늘은 모두 처음이다.':'비슷한 또래의 얼굴들 사이에 앉았다. 익숙한 나이인데도 서로 말을 꺼내기는 어렵다.'}</p></div><div class="event-footer"><span class="tiny">${g.route.route}</span>${btn('생활관으로 →','arrival-next')}</div></main>`}
function focus(){return `<main class="content"><div class="sectionhead"><div><div class="eyebrow">OUR SQUAD · 10 PEOPLE</div><h2>어느 동기 옆에 앉을까?</h2><p class="muted">보급품을 정리하며 먼저 말을 걸어봅니다. 나중에 다른 동기와도 가까워질 수 있습니다.</p></div></div><div class="squad-grid">${g.squad.map(m=>{let p=PROFILES.find(p=>p.id===m.profile);return `<button class="squad-tile" data-focus="${m.id}">${face(m)}<h3>${m.name} <small class="tiny">${m.age}세</small></h3><p>${p.first}</p></button>`}).join('')}</div></main>`}
function schedule(){const w=WEEKS[g.week-1];return `${scene('yard',`${g.route.training} · ${g.week}주차`,'game-scene')}<div class="dialogue"><div class="speaker">이번 주 이야기</div><h2>${w.title}</h2><p>${w.text}</p><div class="schedule-list">${w.schedule.map((s,i)=>`<div><span>일정 ${i+1}</span><strong>${s}</strong></div>`).join('')}</div><p class="tiny">훈련 편성과 날짜는 짧은 게임을 위해 각색했습니다.</p></div><div class="choices"><label style="margin-top:8px">개인정비 시간에는 무엇을 할까?</label>${[['동기와 함께 이야기한다','communication'],['준비물과 배운 내용을 정리한다','order'],['조용히 쉬며 내 상태를 챙긴다','endurance']].map(([t,k],i)=>`<button class="choice" data-plan="${k}"><span class="key">${i+1}</span>${t}</button>`).join('')}</div>`}
function sidebar(){const ids=[...new Set([g.focus,g.approach,...g.history.slice(-2).map(h=>h.peer)])];return `<aside class="game-aside"><div class="sidecard"><div class="dossier-label">MY TRAINING RECORD</div><h3 style="margin-top:12px">${esc(g.profile.name)} <span class="tiny">${g.profile.age}세 · ${g.profile.mbti}</span></h3><div class="record-row"><span>나의 역할</span><strong>${g.role}</strong></div><div class="record-row"><span>입영 계절</span><strong>${['봄','여름','가을','겨울'][g.season]}</strong></div><div class="record-row"><span>기억한 사건</span><strong>${g.history.length}개</strong></div><p class="tiny">가장 최근에 보인 모습<br>${Object.entries(g.traits).sort((a,b)=>b[1]-a[1]).filter(x=>x[1]>0).slice(0,3).map(([k])=>`<span class="result-tag">${TRAITS[k]}</span>`).join('')||'아직 첫날입니다.'}</p></div><div class="sidecard"><h3>가까이 있는 사람들</h3>${ids.map(id=>{const m=g.squad.find(x=>x.id===id);return `<div class="member">${face(m)}<button data-member="${m.id}"><strong>${m.name}</strong><small>${affinityLabel(m)}</small></button></div>`}).join('')}<button class="plain" data-action="squad">분대원 모두 보기 →</button></div><div class="sidecard"><h3>담당 조교</h3>${INSTRUCTORS.map((x,i)=>`<div class="member"><img class="portrait" src="${portrait(20+i,true)}" alt=""><div><strong>${x.name} ${x.rank}</strong><small>${g.instructors[i]>4?'나를 믿고 지켜보는 중':x.type}</small></div></div>`).join('')}</div><p class="tiny">● 이 기기의 브라우저에 자동 저장됩니다.</p></aside>`}
function eventViewLegacy(){const e=eventOf(g),peer=peerOf(g);if(g.phase==='result'){const h=g.history.at(-1);const miniIndex=g.slot===0&&g.week<=4?g.week-1:null;return `${scene(e.scene,`${g.week}주차 · ${e.title}`,'game-scene')}<div class="dialogue"><div class="speaker">그 선택 뒤에</div><h2>${e.title}</h2><p>${esc(h.result)}</p><div class="member" style="margin-top:17px"><img class="portrait" src="${portrait(peer.look)}" alt=""><div><strong>${peer.name}</strong><p style="font-size:13px;margin-top:6px">“${esc(h.reaction)}”</p></div></div><p class="tiny" style="margin-top:12px">${affinityLabel(peer)} · ${h.tags.map(t=>TRAITS[t]).join(' · ')}의 기억</p></div>${miniIndex!==null?miniView(miniIndex):''}<div class="event-footer"><button class="feedback-link" data-action="feedback">비슷한 경험이 있나요?</button><button class="btn primary" data-action="next" ${miniIndex!==null&&!g.mini?'disabled':''}>${g.slot===1?(g.week===5?'수료하기 →':'다음 주로 →'):'다음 이야기 →'}</button></div>`}
const stage=e.lines[g.beat];return `${scene(e.scene,`${g.week}주차 · ${e.title}`,'game-scene')}<div class="dialogue"><div class="speaker">${g.beat===0?'나의 훈련소':`${peer.name}와 나`} <span class="tiny">${g.beat+1} / ${e.lines.length}</span></div><h2>${e.title}</h2><p>${esc(textFor(g,stage))}</p></div>${g.beat<e.lines.length-1?`<div class="event-footer"><span class="tiny">${TRAINERS[g.week-1].name} · ${TRAINERS[g.week-1].role}</span>${btn('계속 읽기 →','beat')}</div>`:`<div class="choices">${e.choices.map((c,i)=>`<button class="choice" data-choice="${i}"><span class="key">${i+1}</span>${esc(c.text)}</button>`).join('')}</div><p class="tiny" style="margin:15px 0">선택은 기억됩니다. 모두에게 같은 답은 없습니다.</p>`}`}

function ending(){if(!catalog.length)return `<main class="content panel"><h2>수료 기록을 정리하고 있습니다.</h2><p>주특기 자료를 불러오는 중입니다.</p>${btn('다시 불러오기','reload')}</main>`;const r=specialtyResult(g,catalog),best=[...g.squad].sort((a,b)=>b.friend-a.friend)[0],s=r.selected;const max=Object.entries(g.traits).sort((a,b)=>b[1]-a[1])[0][0];const types={care:'옆자리가 든든했던 사람',order:'마지막에 한 번 더 확인한 사람',technical:'손으로 답을 찾은 사람',leadership:'흩어진 우리를 모은 사람',team:'함께 끝내려 했던 사람',observation:'작은 것을 놓치지 않은 사람',courage:'먼저 한 걸음 내디딘 사람',communication:'말을 건넬 줄 아는 사람',endurance:'자기 몫을 끝까지 해낸 사람'};return `<main class="content">${clockbar()}${growthPanel()}<div class="ending-title"><div class="eyebrow" style="justify-content:center">FIVE WEEKS LATER</div><h2>수료를 축하합니다,<br>${esc(g.profile.name)} 훈련병.</h2><p class="muted">사람들은 당신을 조금씩 다르게 기억합니다.</p></div>${scene('yard','마지막 인원 확인 · 우리 기수의 수료식')}<div class="panel" style="margin-top:20px"><div class="dossier-label">YOUR NEXT CHAPTER</div><h2>${esc(s.name)}</h2><p class="muted">${esc(s.family)} · 군사특기 ${esc(s.code)}</p><p>당신은 <strong>${types[max]}</strong>으로 기억됩니다.</p><ul class="evidence">${r.evidence.map(h=>`<li>「${esc(h.title)}」에서 ${esc(h.choice)}</li>`).join('')}</ul><p class="tiny">${g.profile.experiences.length?'입대 전 경험: '+g.profile.experiences.map(esc).join(' · '):'입대 전 경험으로 정한 적성을 유지해 연결했습니다.'}</p><hr style="border:0;border-top:1px solid var(--line);margin:20px 0"><p style="font-size:13px"><strong>다음 행선지</strong><br>${s.family==='보병'?'배치 대기 · 보병 부대에서의 다음 이야기':esc(s.family)+' 관련 후속 교육·배치 대기'}</p><p class="tiny">초판은 여기까지입니다. 실제 배정 절차와 다른 게임용 적성 결과이며, 세부 자대는 아직 확정하지 않습니다.<br>${esc(r.note)}</p><button class="plain" data-action="catalog">주특기 자료와 다른 가능성 보기 →</button></div><div class="ending-grid" style="margin-top:20px"><div class="panel"><h3>동기가 기억하는 나</h3><div class="member">${face(best)}<div><strong>${best.name}</strong><small>${affinityLabel(best)}</small></div></div><p class="muted">“${best.friend>=5?'처음에 네 옆에 앉길 잘했다. 진짜 연락해라.':best.friend<0?'같이 지낸 시간이 쉽지만은 않았지. 그래도 수료 축하한다.':'말을 많이 하진 못했어도, 같은 분대였던 건 기억할게.'}”</p></div><div class="panel"><h3>조교들의 마지막 한마디</h3>${INSTRUCTORS.map((x,i)=>`<p class="muted"><strong>${x.name} ${x.rank}</strong><br>“${g.instructors[i]>=5?(i===0?'스스로 확인할 줄 알게 됐습니다. 다음 부대에서도 그렇게 합니다.':'함께 지내는 법을 배웠네요. 지금처럼 주변을 봅니다.'):(i===0?'처음엔 서툴렀지요. 모르면 다시 묻는 것, 잊지 않습니다.':'모든 날이 잘 풀리진 않았지만 여기까지 왔습니다. 수고했습니다.')}”</p>`).join('')}</div></div><div class="hero-actions">${btn('새로운 기수로 다시 입대 ↗','new')}${btn('같은 기수 · 다른 선택','replay','secondary')}</div><div class="event-footer"><button class="feedback-link" data-action="feedback">내 훈련소 이야기도 남기기</button><button class="plain" data-action="export">수료 기록 저장 ↓</button></div></main>`}
function modal(html){$('#modal-root').innerHTML=`<div class="modal-overlay"><section class="modal" role="dialog" aria-modal="true" aria-label="게임 안내"><button class="close" data-action="close" aria-label="닫기">×</button>${html}</section></div>`;setTimeout(()=>$('.modal button, .modal input')?.focus(),0)}
function close(){ $('#modal-root').innerHTML=''}
function feedback(){const h=g?.history.at(-1);const id=h?.id||'ending';const draftKey='ipdae-story-'+id;modal(`<h2>비슷한 경험이 있나요?</h2><p class="muted">${h?'「'+esc(h.title)+'」을 보며 떠오른 이야기':'당신이 기억하는 훈련소 이야기'}를 들려주세요.<br>웃겼던 일도, 민망했던 실수도 좋습니다.</p><label for="story">그때는 어떻게 됐나요?</label><textarea id="story" maxlength="2000" placeholder="등장인물의 실명 대신 별명을 써주세요.">${esc(localStorage.getItem(draftKey)||'')}</textarea><label for="era" style="margin-top:14px">복무 시기 · 선택</label><input id="era" maxlength="30" placeholder="예: 2010년대 초반"><label class="consent"><input id="consent" type="checkbox">제보를 비공개로 검토하고, 인물과 상황을 각색해 게임에 사용하는 데 동의합니다.</label><p class="tiny">개인 연락처나 비공개 군사정보는 적지 않아도 됩니다. 제보 여부는 게임 결과에 영향을 주지 않습니다.</p><p id="submit-status" class="error" role="status"></p><div class="form-bottom"><button class="plain" data-action="close">다음에 할게요</button><button class="btn primary" id="submit-story">이야기 보내기 →</button></div>`);$('#story').addEventListener('input',()=>{try{localStorage.setItem(draftKey,$('#story').value)}catch{}});$('#submit-story').onclick=async()=>{const content=$('#story').value.trim();if(content.length<10){$('#submit-status').textContent='10자 이상 이야기를 적어주세요.';return}if(!$('#consent').checked){$('#submit-status').textContent='각색·수록 동의를 확인해 주세요.';return}const button=$('#submit-story');button.disabled=true;button.textContent='보내는 중…';if(location.protocol==='file:'||document.documentElement.dataset.staticBuild==='true'){const stories=getStore('ipdae-local-stories',[]);stories.push({eventId:id,week:h?.week||5,content,era:$('#era').value,consent:true});localStorage.setItem('ipdae-local-stories',JSON.stringify(stories));modal('<h2>이 기기에 저장했습니다.</h2><p>공개 테스트판에서는 서버로 전송되지 않고 이 기기에만 저장됩니다. 경험담 파일을 저장해 제작자에게 전달할 수 있습니다.</p>'+btn('경험담 파일 저장','export-stories')+btn('게임으로 돌아가기','close','secondary'));return}try{const res=await fetch('/api/stories',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:crypto.randomUUID(),eventId:id,week:h?.week||5,content,era:$('#era').value,consent:true,version:VERSION})});if(!res.ok)throw Error('제보 저장소에 연결하지 못했습니다. 작성한 내용은 이 기기에 보관했습니다.');localStorage.removeItem(draftKey);modal('<h2>이야기를 받았습니다.</h2><p>보내주신 경험은 비공개로 검토한 뒤 새로운 사건으로 각색할 수 있습니다. 함께 이야기를 만들어주셔서 감사합니다.</p>'+btn('다시 훈련소로','close'))}catch(e){if($('#submit-status'))$('#submit-status').textContent=e.message;if(button.isConnected){button.disabled=false;button.textContent='다시 보내기 →'}}}}
function sources(){modal(`<h2>자료와 베타 안내</h2><p>2013년의 입영 경로와 훈련소 생활을 바탕으로 만든 창작 게임입니다. 인물·대화·사건·훈련 편성·적성 배정 규칙은 각색했습니다.</p><p><strong>현재 확인 중인 부분</strong><br>주특기 242개를 역사 자료에서 수록하고 238개를 게임 후보로 사용했습니다. 2013년 공식 목록의 완전한 재현은 아직 아닙니다. 사단 직접 입영으로 각색했습니다. 공식 부대마크는 원본 파일 확인 후 추가합니다.</p><a class="source-link" href="https://www.korea.kr/news/policyNewsView.do?newsId=156031937" target="_blank" rel="noopener">병무청 · 보충대 해체 후 입영 경로 안내 ↗</a><a class="source-link" href="https://normalog.com/45" target="_blank" rel="noopener">2009년 개인 훈련소 회고 ↗</a><a class="source-link" href="https://mdphd.tistory.com/12" target="_blank" rel="noopener">2012년 훈련소 생활 후기 ↗</a><a class="source-link" href="https://github.com/DalerMehndi/enha.github.io/blob/master/mirror/%EA%B5%B0%EC%82%AC%ED%8A%B9%EA%B8%B0.md" target="_blank" rel="noopener">군사특기 보존 자료 · 2차 자료 ↗</a><p class="tiny">제보는 자동으로 게임에 반영되지 않습니다. 검토·각색 후 새 버전으로 추가합니다.</p>`)}
function randomize(field){const r=rng(Date.now()+':'+Math.random());if(field==='all'||field==='name')draft.name=NAMES[Math.floor(r()*NAMES.length)];if(field==='all'||field==='age')draft.age=19+Math.floor(r()*10);if(field==='all'||field==='education'){const a=draft.age<23?['고등학교 졸업','전문대 재학','대학교 재학']:['고등학교 졸업','전문대 재학','대학교 재학','대학교 졸업','대학원 재학'];draft.education=a[Math.floor(r()*a.length)]}if(field==='all'||field==='exp')draft.experiences=shuffle(EXPERIENCES,r).slice(0,1+Math.floor(r()*3));if(field==='all'||field==='mbti')draft.mbti=['EI','SN','TF','JP'].map(s=>s[Math.floor(r()*2)]).join('');if(draft.age<23&&['대학교 졸업','대학원 재학'].includes(draft.education))draft.education='대학교 재학';render()}

function timeline(){const w=WEEKS[g.week-1];return `<section class="timeline-shell"><div class="timeline-top"><div><span class="eyebrow">${g.week}주차 일정</span><h2>${w.title}</h2></div><button class="chip" data-action="squad">분대원</button></div><p class="week-schedule">${w.schedule.join(' · ')}</p><div class="daily-plan"><label>개인정비 목표 · 매일 적용 / 언제든 변경</label><div class="chips">${[['rest','휴식'],['train','체력단련'],['study','복습'],['talk','동기와 대화']].map(([key,t])=>`<button class="chip ${g.dayPlan===key?'active':''}" data-daily-plan="${key}">${t}</button>`).join('')}</div></div><div class="day-logs" role="log" aria-label="나의 군 생활 기록">${g.logs.length?g.logs.slice().reverse().slice(0,18).map(l=>`<article class="log-entry ${l.kind}"><span>${l.day}일째</span><div><p>${esc(l.text)}</p>${l.kind==='schedule'?`<small>${w.schedule.join(' · ')}</small>`:''}${l.effects?.length?`<small>${l.effects.map(([key,n])=>STAT_NAMES[key]+' '+(n>=0?'+':'')+n).join(' · ')}</small>`:''}</div></article>`).join(''):'<article class="log-entry"><span>1일째</span><div><p>생활관에 도착했다. 낯선 얼굴 아홉 명이 나를 본다.</p></div></article>'}</div><div class="timeline-controls">${btn('다음 날 →','tick')}<button class="btn secondary" data-action="auto">${g.autoplay?'❚❚ 일시정지':'▶ 자동 진행'}</button><button class="chip" data-action="speed">${g.speed||1}×</button><button class="plain" data-action="skip-days">다음 사건까지 »</button></div></section>`}
function eventLinesV2(e){return e.lines.flatMap(t=>textFor(g,t).split(/(?<=[.!?。])\s+/)).flatMap(t=>{const out=[];while(t.length>62){let p=t.lastIndexOf(' ',60);if(p<15)p=60;out.push(t.slice(0,p));t=t.slice(p).trim()}if(t)out.push(t);return out})}
function face(m,role='peer'){const index=role==='peer'?g.squad.findIndex(x=>x.id===m.id):role==='instructor'?9+(m||0):11;return `<span class="photo-face ${role==='instructor'?'young-instructor young-'+(m||0):''}" style="--face-x:${(index%4)*100/3}%;--face-y:${Math.floor(index/4)*50}%"><img class="fallback-face" src="${portrait(role==='peer'?m.look:21,role!=='peer')}" alt=""></span>`}
function eventViewV2(){const e=eventOf(g),peer=peerOf(g),lines=eventLines(e),result=g.phase==='result';let inside='';if(result){const h=g.history.at(-1);if(!g.mini){const q=questionFor(g);inside=`<div class="popup-person">${face(0,'teacher')}<div><strong>${TRAINERS[g.week-1].name}</strong><small>${q.type}</small></div></div><div class="popup-copy"><p>${esc(q.teach)}</p><strong>${esc(q.question)}</strong></div><div class="popup-options">${q.options.map((o,i)=>`<button class="choice" data-question="${i}">${o}</button>`).join('')}</div><button class="plain" data-action="v2-skip-quiz">해설을 보고 복습하기</button>`}else{const q=questionFor(g);inside=`<div class="popup-person">${face(peer)}<div><strong>${peer.name}</strong><small>${affinityLabel(peer)}</small></div></div><div class="popup-copy"><p>${esc(h.result)}</p><p>“${esc(h.reaction)}”</p></div><div class="quiz-explain"><strong>${g.mini.correct?'✓ 정답':'함께 복습했습니다'}</strong><p>${q.explain}</p><small>${STAT_NAMES[g.mini.stat]} +${g.mini.change} · ${STAT_NAMES[h.growth[0]]} +${h.growth[1]}</small></div><div class="popup-options">${btn('기록하고 계속하기 →','next')}<button class="feedback-link" data-action="feedback">비슷한 경험이 있나요?</button></div>`}}else{const last=g.beat>=lines.length;inside=`<button class="touch-dialogue" data-action="v2-beat" ${last?'disabled':''} aria-label="다음 대사"><div class="popup-person">${face(peer)}<div><strong>${g.beat%2?peer.name:g.profile.name}</strong><small>${e.title}</small></div></div><p class="popup-line">${esc(last?'어떻게 할까?':lines[g.beat])}</p><span class="touch-hint">${last?'선택지를 눌러주세요':'대화창을 터치하면 다음 대사 ▸'}</span></button>${last?`<div class="popup-options">${e.choices.map((c,i)=>`<button class="choice" data-choice="${i}">${esc(c.text)}</button>`).join('')}</div>`:''}`}
return `<div class="event-overlay"><section class="event-popup ${result?'is-result':''}" role="dialog" aria-modal="true" aria-label="${esc(e.title)}"><div class="event-title"><span>${g.elapsed+1}일째 · ${e.title}</span><small>시간 멈춤</small></div>${scene(e.scene,e.title,'popup-scene')}<div class="popup-body">${inside}</div></section></div>`}

function render(){clearInterval(clock);const pageY=window.scrollY||0,logY=$('.day-logs')?.scrollTop||0;document.documentElement.classList.add('has-portraits');const body=screen==='home'?home():screen==='setup'?setup():screen==='quiz'?quiz():game();$('#app').innerHTML=`<div class="wrap ${g?.settings.large?'large-text':''}">${header()}${body}${screen==='game'?'':footer()}</div>`;document.querySelectorAll('canvas').forEach(c=>drawScene(c,c.dataset.scene,g?.season??2,g?.day??5));if(screen==='setup')bindForm();armedAt=performance.now()+160;const overlay=screen==='game'&&(['event','result','training','medical'].includes(g?.phase)||(g?.phase==='timeline'&&!g.tutorialDone));if(overlay){if(lockedScroll===null)lockedScroll=pageY;document.body.style.position='fixed';document.body.style.top=`-${lockedScroll}px`;document.body.style.width='100%'}else if(lockedScroll!==null){const y=lockedScroll;lockedScroll=null;document.body.style.position='';document.body.style.top='';document.body.style.width='';window.scrollTo(0,y)}else if(lastScreen!==screen){window.scrollTo(0,0)}else window.scrollTo(0,pageY);lastScreen=screen;if($('.day-logs'))$('.day-logs').scrollTop=logY;if(g?.phase==='timeline'&&g.autoplay&&g.tutorialDone&&screen==='game')clock=setInterval(()=>{if(!$('#modal-root').firstChild)tick()},Math.round(650/(g.speed||1)))}
function game(){if(!g)return home();if(g.phase==='notice')return notice();if(g.phase==='arrival')return arrival();if(g.phase==='focus')return focus();if(g.phase==='ending')return ending();return `<main class="timeline-page">${clockbar()}${growthPanel()}${timeline()}${['event','result'].includes(g.phase)?eventView():g.phase==='training'?trainingView():g.phase==='medical'?medicalView():!g.tutorialDone?tutorialView():''}</main>`}
function eventLines(e){return dialogueParts(e).map(p=>p.text)}
function dialogueParts(e){const out=[];for(const raw of e.lines){const line=textFor(g,raw);const pieces=line.split(/“([^”]*)”/);let speaker=line.includes('조교')?'조교':line.includes('교관')?'교관':peerOf(g).name;pieces.forEach((t,i)=>{if(!t.trim())return;const spoken=i%2===1;const sentences=t.split(/(?<=[.!?])\s+/);for(let text of sentences){while(text.length>65){let cut=text.lastIndexOf(' ',62);if(cut<15)cut=62;out.push({text:text.slice(0,cut),spoken,speaker});text=text.slice(cut).trim()}if(text.trim())out.push({text:text.trim(),spoken,speaker})}})}return out}
function eventViewV3(){const e=eventOf(g),peer=peerOf(g),parts=dialogueParts(e),result=g.phase==='result';let inside;if(result){const h=g.history.at(-1);inside=`<div class="popup-person">${face(peer)}<strong>${peer.name}</strong></div><div class="popup-copy"><p>(${esc(h.result)})</p><p>“${esc(h.reaction)}”</p></div><div class="growth-feedback">${STAT_NAMES[h.growth[0]]} +${h.growth[1]}</div><div class="popup-options">${btn('계속하기 →','next')}<button class="feedback-link" data-action="feedback">비슷한 경험이 있나요?</button></div>`}else{const last=g.beat>=parts.length,p=parts[g.beat];const narrator=last||!p.spoken;const instructor=p?.speaker==='조교'||p?.speaker==='교관';const portraitHtml=narrator?'<span class="thought-symbol">···</span>':instructor?face(0,p.speaker==='조교'?'instructor':'teacher'):face(peer);inside=`<button class="touch-dialogue" data-action="v2-beat" ${last?'disabled':''} aria-label="다음 대사"><div class="popup-person">${portraitHtml}<strong>${narrator?g.profile.name+' · 생각':p.speaker}</strong></div><p class="popup-line ${narrator?'inner-thought':''}">${last?'(어떻게 할까?)':narrator?'('+esc(p.text)+')':'“'+esc(p.text)+'”'}</p><span class="touch-hint">${last?'선택지를 눌러주세요':'대화창 터치 · 다음 ▸'}</span></button><div class="dialogue-navigation"><button class="chip" data-action="dialogue-back" ${g.beat===0?'disabled':''}>‹ 이전 대사</button><span>${Math.min(g.beat+1,parts.length)} / ${parts.length}</span></div>${last?`<div class="popup-options">${e.choices.map((c,i)=>`<button class="choice" data-choice="${i}">${esc(c.text)}</button>`).join('')}</div>`:''}`}
return popup(e.title,e.scene,inside,result)}
function popup(title,sceneType,html,result=false){return `<div class="event-overlay"><section class="event-popup ${result?'is-result':''}" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="event-title"><span>${g.elapsed+1}일째 · ${esc(title)}</span><small>시간 멈춤</small></div>${scene(sceneType,title,'popup-scene')}<div class="popup-body">${html}</div></section></div>`}
function trainingViewV3(){const q=questionFor(g);const teacher=INSTRUCTORS[g.trainingIndex%2],stage=g.trainingBeat;const person=`<div class="popup-person">${face(g.trainingIndex%2,'instructor')}<strong>${teacher.name} ${teacher.rank}</strong></div>`;let html;if(!g.mini){html=person+(stage<2?`<button class="touch-dialogue" data-action="training-beat"><p class="popup-line">${stage===0?'“오늘은 '+esc(q.type)+' 교육입니다.”':'“'+esc(q.teach)+'”'}</p><span class="touch-hint">터치하면 다음 ▸</span></button><div class="dialogue-navigation"><button class="chip" data-action="training-back" ${stage===0?'disabled':''}>‹ 이전 대사</button><span>${stage+1} / 2</span></div>`:`<div class="popup-copy"><strong>${esc(q.question)}</strong></div><div class="popup-options">${q.options.map((o,i)=>`<button class="choice" data-question="${i}">${esc(o)}</button>`).join('')}</div><button class="plain" data-action="training-back">‹ 설명 다시 읽기</button><button class="plain" data-action="v2-skip-quiz">해설을 보고 복습하기</button>`)}else html=person+`<div class="quiz-explain"><strong>${g.mini.correct?'✓ 정답':g.mini.skipped?'함께 복습했습니다':'정답을 확인해 봅시다'}</strong><p>${esc(q.explain)}</p><p>정답: ${esc(q.options[q.answer])}</p></div><div class="growth-feedback">${STAT_NAMES[g.mini.stat]} +${g.mini.change}</div><details class="question-source"><summary>교육 자료</summary><p>${esc(q.basis)}<br>${esc(q.year)}</p><a href="${esc(q.source)}" target="_blank" rel="noopener">공개 참고자료 ↗</a></details><div class="popup-options">${btn('교육 마치기 →','training-end')}</div>`;return popup(q.type,'classroom',html,!!g.mini)}
function medicalView(){const html=g.medicalResult?`<div class="popup-person">${face(0,'instructor')}<strong>${INSTRUCTORS[0].name} 상병</strong></div><div class="popup-copy"><p>(${g.medicalResult.text})</p><p>“불편한 곳이 있으면 바로 알립니다.”</p></div><div class="growth-feedback">피로 ${g.medicalResult.change}</div><div class="popup-options">${btn('일정으로 돌아가기 →','medical-end')}</div>`:`<div class="popup-person">${face(0,'instructor')}<strong>${INSTRUCTORS[0].name} 상병</strong></div><div class="popup-copy"><p>“오늘 많이 지쳐 보입니다. 몸 상태는 어떻습니까?”</p><p>(피로가 쌓였다. 지금 내 상태를 먼저 살펴야겠다.)</p></div><div class="popup-options">${['상태를 알리고 진료를 요청한다','조교와 상의하고 휴식을 취한다','불편한 곳을 구체적으로 설명한다'].map((t,i)=>`<button class="choice" data-medical="${i}">${t}</button>`).join('')}</div>`;return popup('몸 상태를 먼저 확인하자','barracks',html,!!g.medicalResult)}
const TUTORIAL=[['나의 첫날','상단에 전역·수료 D-day와 능력치가 표시됩니다. 피로가 쌓이면 회복과 도움 요청도 필요합니다.'],['개인정비 시간 목표 고르기','아래 활동 중 하나를 눌러보세요. 이 선택은 매일 적용되며, 언제든 바꿀 수 있습니다. 훈련소에서 주특기 적성은 변하지 않습니다.'],['시간을 보내는 방법','다음 날은 하루씩, 자동 진행은 선택한 배속으로 날짜를 넘깁니다. 다음 사건까지 버튼으로 평범한 날을 건너뛸 수도 있습니다.'],['사건을 만났다면','사건 중에는 시간이 멈춥니다. 대화창을 터치해 읽고, 이전 대사로 돌아갈 수 있습니다. 일반 선택에는 정답이 없고 교육 문제만 정답이 있습니다. 진행은 자동 저장됩니다.']];
function tutorialView(){const step=g.tutorialStep||0,t=TUTORIAL[step];return `<div class="event-overlay"><section class="event-popup tutorial" role="dialog" aria-modal="true" aria-label="첫날 조작 안내"><div class="event-title"><span>첫날 안내 · ${step+1}/4</span><button class="skip-guide" data-action="tutorial-skip">안내 건너뛰기 ×</button></div><div class="popup-body"><h2>${t[0]}</h2><p class="popup-line">${t[1]}</p>${step===1?`<div class="chips tutorial-goals">${[['rest','휴식'],['train','체력단련'],['study','복습'],['talk','동기와 대화']].map(([k,n])=>`<button class="chip ${g.dayPlan===k?'active':''}" data-tutorial-goal="${k}">${n}</button>`).join('')}</div>`:''}<div class="popup-options"><button class="btn primary" data-action="tutorial-next" ${step===1&&!g.tutorialPlanSet?'disabled':''}>${step===3?'시작하기 →':'다음 →'}</button>${step>0?'<button class="plain" data-action="tutorial-back">‹ 이전 안내</button>':''}</div></div></section></div>`}
function processDay(){const next=dayForward(g);if(next==='event')selectEvent(g);else if(next==='training')beginTraining(g);else if(next==='medical')beginMedical(g);return next}
function tick(){if(g?.phase!=='timeline'||!g.tutorialDone)return;processDay();save();render()}
Object.assign(actions,{'dialogue-back':()=>{if(g.phase==='event'&&g.beat>0){g.beat--;save();render()}},'training-beat':()=>{if(g.phase==='training'&&g.trainingBeat<2&&performance.now()>=armedAt){g.trainingBeat++;save();render()}},'training-back':()=>{if(g.phase==='training'&&!g.mini){g.trainingBeat=Math.max(0,g.trainingBeat-1);save();render()}},'training-end':()=>{endTraining(g);save();render()},'medical-end':()=>{if(g.medicalResult){g.phase='timeline';save();render()}},'tutorial-skip':()=>{g.tutorialDone=true;save();render()},'tutorial-next':()=>{if((g.tutorialStep||0)>=3)g.tutorialDone=true;else g.tutorialStep=(g.tutorialStep||0)+1;save();render()},'tutorial-back':()=>{g.tutorialStep=Math.max(0,(g.tutorialStep||0)-1);save();render()},guide:()=>{if(screen==='game'&&g?.phase==='timeline'){g.tutorialDone=false;g.tutorialStep=0;save();render()}else modal('<h2>플레이 안내</h2><p>입영 후 첫날에 조작 안내를 볼 수 있습니다. 타임라인에서는 생활 목표를 정하고 날짜를 넘깁니다. 사건 중에는 대화를 터치하고 선택합니다.</p>'+btn('닫기','close'))},'skip-days':()=>{if(!g.tutorialDone)return;for(let i=0;i<36&&g.phase==='timeline';i++){const next=processDay();if(next!=='day')break}save();render()},'v2-skip-quiz':()=>{if(g.phase==='training'){quizAnswer(g,-1);g.mini.skipped=true;save();render()}}});
document.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;if(t.dataset.medical!==undefined&&g.phase==='medical'&&performance.now()>=armedAt){medicalChoice(g,+t.dataset.medical);save();render()}if(t.dataset.tutorialGoal){g.dayPlan=t.dataset.tutorialGoal;g.tutorialPlanSet=true;save();render()}});

function talkCard(who,portraitHtml,text,mine=false,action=null){return `<${action?'button':'div'} class="talk-card ${mine?'mine':'other'}" ${action?`data-action="${action}"`:''}><div class="talk-avatar">${portraitHtml}<strong>${esc(who)}</strong></div><p>${text}</p></${action?'button':'div'}>`}
function growthText(h){return h.effects?.length?h.effects.map(([k,n])=>STAT_NAMES[k]+' '+(n>0?'+':'')+n).join(' · '):'능력치 변화 없음'}
function eventView(){const e=eventOf(g),peer=peerOf(g),parts=dialogueParts(e),result=g.phase==='result';let inside;if(result){const h=g.history.at(-1);inside=`<div class="two-talk">${talkCard(peer.name,face(peer),'“'+esc(h.reaction)+'”')}${talkCard(g.profile.name,'<span class="thought-symbol">나</span>','<strong>나의 선택: '+esc(h.choice)+'</strong><br>('+esc(h.result)+')',true)}</div><div class="growth-feedback">${growthText(h)}</div><div class="popup-options">${btn('계속하기 →','next')}<button class="feedback-link" data-action="feedback">비슷한 경험이 있나요?</button></div>`}else{const last=g.beat>=parts.length;const visible=parts.slice(0,Math.min(g.beat+1,parts.length));const spoken=visible.filter(p=>p.spoken).at(-1),thought=visible.filter(p=>!p.spoken).at(-1);let who=spoken?.speaker||peer.name;const role=who==='조교'?'instructor':who==='교관'?'teacher':null;const otherPhoto=role?face(0,role):face(peer);inside=`<div class="two-talk">${talkCard(who,otherPhoto,spoken?'“'+esc(spoken.text)+'”':'…',false,last?null:'v2-beat')}${talkCard(g.profile.name,'<span class="thought-symbol">나</span>',last?'(어떻게 할까?)':'('+esc(thought?.text||'상대의 말을 듣는다.')+')',true,last?null:'v2-beat')}</div><div class="dialogue-navigation"><button class="chip" data-action="dialogue-back" ${g.beat===0?'disabled':''}>‹ 이전 대사</button><span>${last?'선택지를 눌러주세요':'어느 대화창이든 터치 · 다음 ▸'}</span></div>${last?`<div class="popup-options">${e.choices.map((c,i)=>`<button class="choice" data-choice="${i}">${esc(c.text)}</button>`).join('')}</div>`:''}`}
return popup(e.title,e.scene,inside,result)}
function trainingView(){const q=questionFor(g),teacher=INSTRUCTORS[g.trainingIndex%2],stage=g.trainingBeat;const otherText=g.mini?q.explain:stage===0?'오늘은 '+q.type+' 교육입니다.':stage===1?q.teach:q.question;const mineText=g.mini?(g.mini.skipped?'(해설을 보고 복습했다.)':'내가 고른 답: '+esc(q.options[g.mini.answerIndex]||'')):stage<2?'(조교의 설명을 듣는다.)':'(배운 내용을 떠올려 보자.)';let html=`<div class="two-talk">${talkCard(teacher.name+' '+teacher.rank,face(g.trainingIndex%2,'instructor'),'“'+esc(otherText)+'”',false,!g.mini&&stage<2?'training-beat':null)}${talkCard(g.profile.name,'<span class="thought-symbol">나</span>',mineText,true,!g.mini&&stage<2?'training-beat':null)}</div>`;if(!g.mini){html+=stage<2?`<div class="dialogue-navigation"><button class="chip" data-action="training-back" ${stage===0?'disabled':''}>‹ 이전 대사</button><span>대화창 터치 · 다음 ▸</span></div>`:`<div class="popup-options">${q.options.map((o,i)=>`<button class="choice" data-question="${i}">${esc(o)}</button>`).join('')}</div><div class="dialogue-navigation"><button class="plain" data-action="training-back">‹ 설명 다시 읽기</button><button class="plain" data-action="v2-skip-quiz">해설 보기</button></div>`}else html+=`<div class="quiz-explain"><strong>${g.mini.correct?'✓ 정답':g.mini.skipped?'함께 복습했습니다':'정답: '+esc(q.options[q.answer])}</strong></div><div class="growth-feedback">${g.mini.change?STAT_NAMES[g.mini.stat]+' +'+g.mini.change:'능력치 변화 없음'}</div><details class="question-source"><summary>교육 자료</summary><p>${esc(q.basis)} · ${esc(q.year)}</p><a href="${esc(q.source)}" target="_blank" rel="noopener">참고자료 ↗</a></details><div class="popup-options">${btn('교육 마치기 →','training-end')}</div>`;return popup(q.type,'classroom',html,!!g.mini)}

render();

</script></body></html>
